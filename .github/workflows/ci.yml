# Continuous Integration + continuous testing.
# Runs on every push and pull request: build, unit + integration tests (Testcontainers),
# architecture rules (ArchUnit / Spring Modulith), 80% coverage gate (JaCoCo),
# secret scanning (Gitleaks) and a Docker image build check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify = compile + unit tests (Surefire) + unit coverage check (fails below 80%)
      #          + integration tests with real PostgreSQL/Mailpit via Testcontainers (Failsafe)
      #          + ArchUnit/Modulith rules + total coverage report
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          for r in "jacoco-unit:Unit tests (gate: 80%)" "jacoco:Total (unit + integration)"; do
            f="target/site/${r%%:*}/jacoco.csv"
            [ -f "$f" ] && awk -F, -v name="${r#*:}" 'NR>1 {m+=$8; c+=$9} END {printf "### %s: %.1f%% (%d/%d lines)\n", name, 100*c/(c+m), c, c+m}' \
              "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            target/site/jacoco/
            target/site/jacoco-unit/
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # the action lists the PR's commits through the API on pull_request events
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan the whole history, not only the last commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-tests:
    name: API tests (Postman / Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      # Throw-away secrets for this run only (never stored anywhere)
      - name: Create .env with random secrets
        run: |
          sed -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" \
              -e "s|^API_KEY=.*|API_KEY=$(openssl rand -hex 32)|" \
              -e "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 32)|" \
              -e "s|^CARD_ENCRYPTION_KEY=.*|CARD_ENCRYPTION_KEY=$(openssl rand -base64 32)|" \
              .env.example > .env
          echo "::add-mask::$(grep '^API_KEY=' .env | cut -d= -f2)"

      - name: Start stack (app + postgres + mailpit)
        run: docker compose up --build -d

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/ping && exit 0
            sleep 2
          done
          docker compose logs app
          exit 1

      - name: Run Postman collection
        run: |
          npx -y newman@6 run postman/payment-tokenization.postman_collection.json \
            -e postman/local.postman_environment.json \
            --env-var "apiKey=$(grep '^API_KEY=' .env | cut -d= -f2)" \
            --reporters cli,junit --reporter-junit-export target/newman/results.xml

      - name: App logs on failure
        if: failure()
        run: docker compose logs app

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-report
          path: target/newman/

      - name: Stop stack
        if: always()
        run: docker compose down -v

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: payment-tokenization-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
