# Test-only values (fake, not secrets). The datasource is provided by Testcontainers (@ServiceConnection).
spring:
  mail:                              # overridden by the Mailpit Testcontainer (TestcontainersConfiguration)
    host: localhost
    port: 3025

app:
  notification:
    from: no-reply@test.local
  events:
    retry:
      interval: 1h                   # tests trigger the resubmission explicitly
      min-age: 0s
      max-attempts: 3
  payment:
    rejection-probability: 0.0       # deterministic: failures are covered by dedicated tests
    max-retries: 3
    retry-backoff: 0ms
  tokenization:
    rejection-probability: 0.0       # deterministic: rejection is covered by dedicated tests
  crypto:
    active-key-id: k1
    keys:
      k1: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=   # test-only key (bytes 0..31)
  security:
    api-key: test-api-key-0123456789-abcdefghijklmnop
    jwt:
      # Base64 of a 32-byte test-only value
      secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQtMzItYnl0ZXMtbG9uZyE=
      ttl: 30m
      issuer: payment-tokenization-system
